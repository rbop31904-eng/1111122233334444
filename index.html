<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظم الدكتور - جراحة الأوعية الدموية</title>
    <style>
        :root {
            --bg-black: #050505;
            --card-black: #121212;
            --card-border: #262626;
            --text-white: #ffffff;
            --text-muted: #a1a1aa;
            --red-accent: #dc2626;
            --red-hover: #b91c1c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        /* شاشة الفيديو الترحيبي والتنبيه بكامل الشاشة */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            overflow: hidden;
        }

        #intro-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-controls {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 15px;
            z-index: 10000;
        }

        .video-btn {
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            border: 2px solid var(--red-accent);
            padding: 12px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.3s;
        }

        .video-btn:hover {
            background: var(--red-accent);
        }

        /* التطبيق الرئيسي */
        .container {
            width: 100%;
            max-width: 650px;
            display: none;
            flex-direction: column;
            gap: 20px;
            margin-top: 10px;
        }

        header {
            text-align: center;
            padding: 20px;
            background: var(--card-black);
            border: 1px solid var(--card-border);
            border-top: 4px solid var(--red-accent);
            border-radius: 12px;
        }

        header h1 {
            color: #ffffff;
            font-size: 22px;
            margin-bottom: 6px;
        }

        header p {
            color: var(--red-accent);
            font-weight: 600;
            font-size: 14px;
        }

        .status-box {
            background: #1e1010;
            border: 1px solid var(--red-accent);
            padding: 10px 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 13px;
            color: #fca5a5;
        }

        .card {
            background: var(--card-black);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .card h2 {
            font-size: 17px;
            margin-bottom: 15px;
            color: #ffffff;
            border-right: 4px solid var(--red-accent);
            padding-right: 10px;
        }

        .grid-timers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .timer-box {
            background: #000000;
            border: 1px solid var(--card-border);
            padding: 14px;
            border-radius: 8px;
            text-align: center;
        }

        .timer-box p {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .timer-box span {
            font-size: 17px;
            font-weight: bold;
            color: var(--red-accent);
        }

        .full-width {
            grid-column: span 2;
        }

        /* إدارة الجدول */
        .schedule-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        input, select {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: #000000;
            color: #ffffff;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--red-accent);
        }

        button.action-btn {
            background: var(--red-accent);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: 0.2s;
        }

        button.action-btn:hover {
            background: var(--red-hover);
        }

        .schedule-list {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .schedule-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000000;
            border: 1px solid var(--card-border);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        .badge-work { 
            background: var(--red-accent);
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-off { 
            background: #262626;
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }

        .delete-btn:hover {
            color: var(--red-accent);
        }
    </style>
</head>
<body>

    <!-- واجهة الفيديو الذي صممته (صوت وصورة معاً) -->
    <div id="intro-overlay">
        <!-- تأكد أن اسم الفيديو في مجلدك هو intro-video.mp4 -->
        <video id="intro-video" src="intro-video.mp4" autoplay playsinline></video>
        <div class="video-controls">
            <button class="video-btn" onclick="closeIntro()">تخطي والدخول للتطبيق</button>
        </div>
    </div>

    <!-- واجهة التطبيق -->
    <div class="container" id="main-app">
        <header>
            <h1>منظم جدول جراحة الأوعية الدموية</h1>
            <p id="current-date-display"></p>
            <div id="alarm-status" class="status-box">🔔 منبه الـ 9:00 صباحاً (توقيت القاهرة) نشط لتنبيه ما قبل العمل</div>
        </header>

        <!-- المؤقتات والمواعيد -->
        <div class="card">
            <h2>العد التنازلي والمواعيد</h2>
            <div class="grid-timers">
                <div class="timer-box">
                    <p>العد التنازلي لرمضان</p>
                    <span id="ramadan-countdown">--</span>
                </div>
                <div class="timer-box">
                    <p>متبقي لهدف (سنتين)</p>
                    <span id="two-years-countdown">--</span>
                </div>
                <div class="timer-box full-width">
                    <p>الوقت المتبقي لكسوة وملابس العيد</p>
                    <span id="eid-countdown">--</span>
                </div>
            </div>
        </div>

        <!-- جدول العمل والإجازات -->
        <div class="card">
            <h2>تحديد جدول العمل والإجازة</h2>
            <div class="schedule-form">
                <div class="form-row">
                    <input type="date" id="shift-date">
                    <select id="shift-type">
                        <option value="عمل جراحي">عمل جراحي 🩺</option>
                        <option value="إجازة راحة">إجازة راحة 🏠</option>
                    </select>
                </div>
                <button class="action-btn" onclick="saveShift()">حفظ في الجدول</button>
            </div>
            <ul class="schedule-list" id="schedule-list">
                <!-- المواعيد المحفوظة -->
            </ul>
        </div>
    </div>

    <script>
        const introOverlay = document.getElementById('intro-overlay');
        const mainApp = document.getElementById('main-app');
        const introVideo = document.getElementById('intro-video');

        // طلب إذن الإشعارات
        if ("Notification" in window) {
            Notification.requestPermission();
        }

        // تشغيل فيديو الصوت الخاص بك مباشرةً وبأقصى صوت
        window.addEventListener('DOMContentLoaded', () => {
            introVideo.muted = false;
            introVideo.volume = 1.0;
            
            let playPromise = introVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    // تفاعل بسيط لضمان عمل الصوت في حال قيود المتصفح
                    document.addEventListener('click', () => {
                        introVideo.muted = false;
                        introVideo.play();
                    }, { once: true });
                });
            }
        });

        introVideo.onended = function() {
            closeIntro();
        };

        function closeIntro() {
            introOverlay.style.display = 'none';
            mainApp.style.display = 'flex';
        }

        // عرض التاريخ اليومي
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date-display').innerText = new Date().toLocaleDateString('ar-EG', options);

        // نظام الفحص الذكي لتنبيه الـ 9 صباحاً بتوقيت القاهرة
        function checkMorningAlarm() {
            const shifts = JSON.parse(localStorage.getItem('doctorShifts')) || [];
            
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];
            
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            const tomorrowStr = tomorrow.toISOString().split('T')[0];

            const todayShift = shifts.find(s => s.date === todayStr);
            const tomorrowShift = shifts.find(s => s.date === tomorrowStr);

            const isTodayOff = todayShift && todayShift.type.includes('إجازة');
            const isTomorrowWork = tomorrowShift && tomorrowShift.type.includes('عمل');

            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();

            // إذا كان اليوم إجازة وغداً عمل، والساعة أصبحت 9:00 صباحاً بالتحديد
            if (isTodayOff && isTomorrowWork) {
                if (currentHour === 9 && currentMinute === 0) {
                    triggerAlarmVideo();
                }
            }
        }

        function triggerAlarmVideo() {
            introOverlay.style.display = 'flex';
            introVideo.currentTime = 0;
            introVideo.muted = false;
            introVideo.volume = 1.0;
            introVideo.play();

            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("تنبيه جدول جراحة الأوعية الدموية 🩺", {
                    body: "اليوم إجازة وغداً لديك عمل جراحي! تم تفعيل فيديو التنبيه.",
                    icon: "https://cdn-icons-png.flaticon.com/512/3004/3004458.png"
                });
            }
        }

        // فحص التوقيت كل دقيقة بدقة
        setInterval(checkMorningAlarm, 60000);

        // عدادات الأوقات والمناسبات
        function updateCountdowns() {
            const now = new Date();
            
            const ramadanDate = new Date('2027-02-08T00:00:00'); 
            const diffRamadan = Math.ceil((ramadanDate - now) / (1000 * 60 * 60 * 24));
            document.getElementById('ramadan-countdown').innerText = diffRamadan > 0 ? `${diffRamadan} يوم` : 'رمضان مبارك!';

            const targetTwoYears = new Date();
            targetTwoYears.setFullYear(targetTwoYears.getFullYear() + 2);
            const diffYears = Math.ceil((targetTwoYears - now) / (1000 * 60 * 60 * 24));
            document.getElementById('two-years-countdown').innerText = `${diffYears} يوم`;

            const eidDate = new Date('2027-03-10T00:00:00');
            const diffEid = Math.ceil((eidDate - now) / (1000 * 60 * 60 * 24));
            document.getElementById('eid-countdown').innerText = diffEid > 0 ? `${diffEid} يوم متبقي للشراء` : 'وقت العيد!';
        }
        updateCountdowns();

        // إدارة جدول العمل
        function saveShift() {
            const date = document.getElementById('shift-date').value;
            const type = document.getElementById('shift-type').value;

            if (!date) {
                alert('الرجاء اختيار التاريخ');
                return;
            }

            let shifts = JSON.parse(localStorage.getItem('doctorShifts')) || [];
            shifts = shifts.filter(s => s.date !== date);
            shifts.push({ date, type });
            shifts.sort((a, b) => new Date(a.date) - new Date(b.date));

            localStorage.setItem('doctorShifts', JSON.stringify(shifts));
            loadShifts();
            checkMorningAlarm();
        }

        function deleteShift(date) {
            let shifts = JSON.parse(localStorage.getItem('doctorShifts')) || [];
            shifts = shifts.filter(s => s.date !== date);
            localStorage.setItem('doctorShifts', JSON.stringify(shifts));
            loadShifts();
        }

        function loadShifts() {
            const listEl = document.getElementById('schedule-list');
            listEl.innerHTML = '';
            let shifts = JSON.parse(localStorage.getItem('doctorShifts')) || [];

            if (shifts.length === 0) {
                listEl.innerHTML = '<li style="text-align:center; color:#a1a1aa; padding: 15px;">لا توجد أيام مسجلة بعد.</li>';
                return;
            }

            shifts.forEach(s => {
                const li = document.createElement('li');
                li.className = 'schedule-item';
                li.innerHTML = `
                    <span>📅 <strong>${s.date}</strong></span> 
                    <div style="display: flex; align-items: center;">
                        <span class="${s.type.includes('عمل') ? 'badge-work' : 'badge-off'}">${s.type}</span>
                        <button class="delete-btn" onclick="deleteShift('${s.date}')" title="حذف">✕</button>
                    </div>
                `;
                listEl.appendChild(li);
            });
        }
        loadShifts();
    </script>
</body>
</html>
